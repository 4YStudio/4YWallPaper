[package]
name = "fourywallpaper"
version = "0.1.0"
description = "4YWallPaper - 动态壁纸管理器 (基于 linux-wallpaperengine)"
authors = ["4Y"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "fourywallpaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
regex = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
